# --- GPU Stack (RTX 2050, 4GB VRAM) Role Mappings ---
gpu:
  router:
    model: "qwen3:0.6b"
    fallback: "qwen2.5:0.5b"
  general:
    model: "qwen2.5:1.5b"
    fallback: "qwen3:1.7b"
  reasoning:
    model: "qwen3:4b"
    fallback: "qwen3:1.7b"
  planner:
    model: "qwen3:4b"
    fallback: "qwen3:1.7b"
  coding:
    model: "qwen2.5-coder:1.5b"
    fallback: "qwen2.5-coder:3b"
  coding_heavy:
    model: "qwen2.5-coder:3b"
    fallback: "qwen2.5-coder:1.5b"
  vision:
    model: "qwen3-vl:4b"
    fallback: "qwen2.5vl:3b"
  vision_fallback:
    model: "qwen2.5vl:3b"
    fallback: null
  embedding:
    model: "nomic-embed-text"
    fallback: "nomic-embed-text:latest"
  fallback:
    model: "qwen2.5:0.5b"
    fallback: null

# --- CPU Stack (Fallback when no GPU available) ---
cpu:
  router:
    model: "qwen2.5:0.5b"
  general:
    model: "qwen2.5:1.5b"
  reasoning:
    model: "qwen3:1.7b"
  planner:
    model: "qwen3:1.7b"
  coding:
    model: "qwen2.5-coder:1.5b"
  vision:
    model: "qwen2.5vl:3b"
  embedding:
    model: "nomic-embed-text"
  fallback:
    model: "qwen2.5:0.5b"

# --- Always-warm models pre-loaded at startup ---
always_warm:
  - "qwen2.5:0.5b"
  - "qwen2.5:1.5b"
  - "qwen3:0.6b"
  - "nomic-embed-text"

# --- Required local models ---
required:
  - "qwen2.5:0.5b"
  - "qwen3:0.6b"
  - "qwen2.5:1.5b"
  - "qwen3:1.7b"
  - "qwen3:4b"
  - "qwen2.5-coder:1.5b"
  - "qwen2.5-coder:3b"
  - "qwen3-vl:4b"
  - "qwen2.5vl:3b"
  - "nomic-embed-text"
