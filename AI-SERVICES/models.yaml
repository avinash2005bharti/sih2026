# --- Centralized Model Registry Definitions ---
models:
  qwen2.5:0.5b:
    name: "qwen2.5:0.5b"
    provider: "ollama"
    endpoint: "http://127.0.0.1:11434"
    capabilities: ["classification", "routing", "greetings", "trivial_response"]
    task_types: ["SIMPLE_GREETING", "TRIVIAL_CLASSIFICATION"]
    modality: "text"
    context_length: 32768
    priority: 1
    fallback: null
    temperature: 0.2
    timeout: 30.0
    vram_mb: 400
    keep_warm: true
    keep_alive: "-1"
    gpu_suitability: "ideal"
    description: "Ultra-fast classification, simple routing, fallback greetings (397MB)"

  qwen3:0.6b:
