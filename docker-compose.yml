services:
  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    container_name: sovereign-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_SOCKET_URL: http://localhost:5000
      VITE_BACKEND_URL: http://backend:5000
      VITE_ENABLE_OFFLINE_DEMO: "false"
    depends_on:
      backend:
        condition: service_started
    networks:
      - sovereign-network

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: sovereign-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-e2a10712c75bfd49619aa25161d2c225feadf8b89de1b35b07f13c9076d15a60}
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017/sovereign_ai?authSource=admin
      AI_SERVICE_URL: http://ai-service:8000
      PYTHON_AI_SERVICE_URL: http://ai-service:8000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_HOST: http://host.docker.internal:11434
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-avinashbharti3007@gmail.com}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - sovereign-network

  ai-service:
    build:
      context: ./AI-SERVICES
      dockerfile: Dockerfile
    container_name: sovereign-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Sovereign AI Service
      HOST: 0.0.0.0
      PORT: 8000

      # MongoDB Connection
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017/sovereign_ai?authSource=admin
      MONGO_DB_NAME: sovereign_ai

      # Ollama (runs locally on Windows host or remote machine)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-qwen2.5-coder:1.5b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
      OLLAMA_KEEP_ALIVE: "0"

      # Multimodal OCR & Vision
      VISION_MODEL: ${VISION_MODEL:-moondream}
      OCR_ENGINE: ${OCR_ENGINE:-paddleocr}
      OCR_USE_GPU: "false"
      OCR_DEVICE: "cpu"

      # Memory Architecture
      MEMORY_ENABLED: "true"
      STM_ENABLED: "true"
      STM_MAX_MESSAGES: "20"
      STM_MAX_TOKENS: "8000"
      LTM_ENABLED: "true"
      LTM_TOP_K: "5"
      LTM_SCORE_THRESHOLD: "0.35"
      LTM_MAX_CONTEXT: "4000"
      MEM0_ENABLED: "true"

      # Embedding Provider
      EMBEDDING_PROVIDER: "ollama"
      OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"

      # Qdrant Vector Database
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: sovereign_documents
      QDRANT_MEMORY_COLLECTION: sovereign_ai_memory
      QDRANT_VECTOR_SIZE: 768

      # Neo4j Knowledge Graph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_URL: http://neo4j:7474
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sovereignpass}
      NEO4J_DATABASE: neo4j

      # Valkey Caching & State
      VALKEY_URL: redis://valkey:6379

      LOG_LEVEL: INFO

    volumes:
      - ai_workspace_data:/app/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      valkey:
        condition: service_started
    networks:
      - sovereign-network

  mongodb:
    image: mongo:8
    container_name: sovereign-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    volumes:
      - checkpointing_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.runCommand({ ping: 1 }).ok"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - sovereign-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sovereign-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sovereign-network

  valkey:
    image: valkey/valkey:latest
    container_name: sovereign-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sovereign-network

  neo4j:
    image: neo4j:5.26
    container_name: sovereign-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-sovereignpass}
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:7474 >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sovereign-network

networks:
  sovereign-network:
    driver: bridge

volumes:
  checkpointing_mongodb_data:
    driver: local
  qdrant_data:
    driver: local
  valkey_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  backend_uploads:
    driver: local
  ai_workspace_data:
    driver: local
