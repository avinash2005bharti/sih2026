services:
  mongodb:
    image: mongo:8
    container_name: sovereign-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - checkpointing_mongodb_data:/data/db

volumes:
  checkpointing_mongodb_data:
    external: true